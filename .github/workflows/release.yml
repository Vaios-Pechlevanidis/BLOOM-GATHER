# Build the packages for every platform. Runs by hand (Actions > Release >
# Run workflow) or when a version tag like v0.2.0 is pushed; a tag also
# creates a GitHub release with the packages attached.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: macOS package
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/package-macos.sh

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfuse2
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" scripts/package-linux.sh

      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: bloom-and-gather-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
