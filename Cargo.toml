[workspace]
members = [".", "crates/bloom_core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bloom_core = { path = "crates/bloom_core" }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
# Same version Bevy 0.16 uses, so core math types *are* Bevy's types.
glam = "0.29"

[package]
name = "bloom-and-gather"
description = "A cozy, finite, incremental flower-picking and bouquet-crafting desktop game."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "bloom-and-gather"

[dependencies]
bloom_core.workspace = true
bevy = "0.16"

[features]
# Faster incremental rebuilds during development: `cargo run --features dev`.
dev = ["bevy/dynamic_linking"]

# Compile dependencies (Bevy) with optimizations even in debug builds so the
# game is playable while iterating; our own crates stay quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
